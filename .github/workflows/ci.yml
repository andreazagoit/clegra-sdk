# Checks of the package and its examples. Nothing is published from CI: the owner publishes with
# `npm publish --tag next` (docs/RELEASE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run hygiene
      - run: npm run typecheck:all
      - run: npm test
      - run: npm run test:examples
      - run: npm run test:next
      - run: npm run pack:check -- --dir "$RUNNER_TEMP/clegra-pack-check"
